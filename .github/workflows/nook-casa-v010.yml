name: Nook Casa 0.10 checks

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  renderer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install Pillow==11.3.0 tzdata
      - name: Compile server and modules
        run: |
          python -m py_compile nook_casa/server.py nook_casa/collector_v010.py nook_casa/renderer_v010.py
      - name: Test landscape layout and missing-data cases
        run: python tests/test_v010.py

      - name: Generate 0.10.1 demo PNG with the real renderer
        run: python tests/generate_mockup_v0101.py
      - name: Commit mockup to the release branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/mockup-landscape-v0101.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: generate official 0.10.1 Nook mockup"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
