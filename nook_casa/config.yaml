name: Nook Casa
version: "0.4.1"
slug: nook_casa
description: Local Nook Simple Touch e-ink dashboard with hot water and Holiday controls
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Local Nook API
options:
  public_url: "http://192.168.1.100:8099"
  device_id: "nook-casa"
  api_key: ""
  refresh_seconds: 1800
  entity_soc: "sensor.batteries_state_of_capacity"
  entity_solar: "sensor.inverter_daily_yield"
  entity_grid: "sensor.grid_import_today"
  entity_consumption: "sensor.home_consumption_today"
  entity_acs: "sensor.ecodan_heatpump_dhw_current_temp"
  entity_force: "switch.ecodan_heatpump_force_dhw"
  entity_holiday: "switch.ecodan_heatpump_holiday_mode"
  entity_operation: "sensor.ecodan_heatpump_operation_mode"
  entity_aqi: "sensor.air_quality_index"
  entity_spanky: "sensor.xpeng_battery"
  weather_entity: "weather.home"
  waste_calendar: "calendar.waste_collection"
schema:
  public_url: url
  device_id: str
  api_key: password
  refresh_seconds: int(120,86400)
  entity_soc: str
  entity_solar: str
  entity_grid: str
  entity_consumption: str
  entity_acs: str
  entity_force: str
  entity_holiday: str
  entity_operation: str
  entity_aqi: str
  entity_spanky: str
  weather_entity: str
  waste_calendar: str
